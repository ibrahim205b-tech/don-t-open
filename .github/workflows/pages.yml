# Publishes the static site to the gh-pages branch, which GitHub Pages serves.
# Only the public files are copied; tests and tools stay out of the site.
# Manual only: nothing is published until the owner runs it (Actions → Run workflow)
# and GitHub Pages is enabled in the repository settings.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html 404.html manifest.webmanifest .nojekyll assets css fonts js _site/

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
