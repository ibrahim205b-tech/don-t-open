<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>هذا الباب ما موجود — DON'T OPEN</title>
  <meta name="robots" content="noindex">
  <style>
    html, body { margin: 0; background: #070607; color: #eceae6; font-family: "Segoe UI", Tahoma, system-ui, sans-serif; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 0 0 12px; }
    p { color: #b3acaa; margin: 0 0 28px; }
    a { display: inline-block; padding: 14px 26px; border-radius: 12px; background: #9b0e1d; color: #fff; text-decoration: none; font-weight: 700; }
    a:focus-visible { outline: 2px solid #ff4646; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>هذا الباب ما موجود</h1>
    <p>This door doesn’t exist. Maybe it never did.</p>
    <a id="home" href="./">ارجع للباب الأول</a>
  </main>
  <script>
    // On a GitHub Pages project site the app lives under /<repo>/.
    var seg = location.pathname.split('/').filter(Boolean)[0];
    if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById('home').href = '/' + seg + '/';
    else document.getElementById('home').href = '/';
  </script>
</body>
</html>
